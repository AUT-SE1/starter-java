openapi: 3.0.3
info:
  title: Starter Service
  version: 1.0.0
  description: >
    The shared contract for the Software Engineering Lab starter service.
    Every team's service exposes these operations with identical status codes
    and response shapes, so a neighbouring team can write a contract test
    against it without reading its source code.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: The service is responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /orders:
    post:
      summary: Create an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The order was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: The request body failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}:
    get:
      summary: Fetch one order
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No order with that id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settlement-reports:
    get:
      summary: Get daily settlement report
      description: دریافت گزارش تسویه‌های یک روز کاری جهت بررسی و تطبیق مغایرت‌ها
      operationId: getSettlementReport
      parameters:
        - name: date
          in: query
          required: false
          description: تاریخ روز کاری مورد نظر (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-10-31"
      responses:
        '200':
          description: Settlement report fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementReportData'              
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateOrderRequest:
      type: object
      required: [item, quantity]
      properties:
        item:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
    Order:
      type: object
      required: [id, item, quantity, status]
      properties:
        id:
          type: string
        item:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum: [created]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [validation_failed, not_found]
        field:
          type: string
        message:
          type: string
    SettlementReportData:
      type: object
      required:
        - report_id
        - business_date
        - generated_at
        - summary
        - transactions
      properties:
        report_id:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        generated_at:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/SettlementReportSummary'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/SettlementReportItem'

    SettlementReportSummary:
      type: object
      required:
        - totalCount
        - totalAmount
        - successCount
        - failedCount
      properties:
        totalCount:
          type: integer
          format: int64
        totalAmount:
          type: integer
          format: int64
        successCount:
          type: integer
          format: int64
        failedCount:
          type: integer
          format: int64

    SettlementReportItem:
      type: object
      required:
        - transactionId
        - sourceIban
        - destinationIban
        - amount
        - currency
        - settlementType
        - status
        - createdAt
      properties:
        transactionId:
          type: string
          format: uuid
        correlationId:
          type: string
        idempotencyKey:
          type: string
        sourceIban:
          type: string
        destinationIban:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        settlementType:
          type: string
        status:
          type: string
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          nullable: true      
