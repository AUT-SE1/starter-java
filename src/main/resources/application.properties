spring.application.name=s5-settlement-gateway
server.address=0.0.0.0
server.port=${SERVER_PORT:8085}

# Database Connection (PostgreSQL via Environment Variables)
# رمز عمداً default ندارد (GEN-12): DB_PASSWORD را در .env یا محیط بدهید.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/s5_settlement_db}
spring.datasource.username=${DB_USERNAME:labbank_s5}
spring.datasource.password=${DB_PASSWORD:secret_s5_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# JPA & Flyway Migration
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Execution report: Every day at 00:00 Tehran time
settlement.report.cron=0 0 0 * * *

# RTGS engine
# نوع تسویه‌ی تراکنش‌های ورودی از S3 (پیام S3 نوع ندارد)
settlement.default-type=RTGS
settlement.rtgs.latency-ms=${RTGS_LATENCY_MS:200}
settlement.rtgs.transient-failure-rate=${RTGS_TRANSIENT_RATE:0.05}
settlement.rtgs.failure-rate=${RTGS_FAILURE_RATE:0.05}
settlement.rtgs.max-amount=100000000000
settlement.rtgs.max-attempts=3
settlement.rtgs.stuck-timeout-seconds=60

# Kafka listeners (در تست‌ها false)
kafka.listeners.auto-startup=${KAFKA_LISTENERS_AUTO_STARTUP:true}

# Kafka S6 Configuration
kafka.clusters.s6.bootstrap-servers=${KAFKA_S6_BOOTSTRAP_SERVERS:localhost:9092}
kafka.clusters.s6.topics.daily-report=lab.s5.s6.report.daily.v1
kafka.clusters.s6.topics.report-result=lab.s6.s5.event.report-result.v1
kafka.clusters.s6.topics.report-inquire=lab.s6.s5.command.report.inquire.v1

# Kafka S3 Configuration
# در لوکال هر دو cluster همان یک broker هستند. 9093 پورت controller است، نه پورت کلاینت.
kafka.clusters.s3.bootstrap-servers=${KAFKA_S3_BOOTSTRAP_SERVERS:localhost:9092}
kafka.clusters.s3.topics.external-transfer=lab.s3.s5.command.transfer.external.v2
kafka.clusters.s3.topics.inquire-transfer=lab.s3.s5.command.transfer.inquire.v2
kafka.clusters.s3.topics.operation-result=lab.s5.s3.event.operation-result.v2
