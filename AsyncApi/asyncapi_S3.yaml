            amount: 2500000
            currency: IRR
            external_reference: S5-DEMO-REFERENCE-001
            status: SETTLED
            updated_at: '2026-01-01T12:00:00Z'
          causation_id: 6421301a-cc02-463b-85bb-b41d405ca556
          outcome: APPLIED
      - name: synthetic-rejection
        payload:
          message_id: d4d930de-8143-42f7-b98e-b0da1c638a63
          schema_version: '3.0'
          transaction_id: 2c4b5314-a624-4a95-a103-b12362e74073
          correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
          occurred_at: '2026-01-01T12:00:00Z'
          producer: S5-STL
          message_type: InquireExternalTransferResult.v3
          operation_id: 526135c2-9ba0-443d-add2-bf4e929318e3
          causation_id: 6421301a-cc02-463b-85bb-b41d405ca556
          outcome: REJECTED
          error:
            code: NOT_FOUND
            retryable: false
            public_message: Synthetic example only.
            problem:
              type: https://errors.labbank.example/contract-example
              title: Rejected command
              status: 404
              code: NOT_FOUND
              detail: No real transfer is represented.
              correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
  schemas:
    IranianIBAN:
      type: string
      pattern: ^IR[0-9]{24}$
      minLength: 26
      maxLength: 26
      description: 'Canonical Iranian destination IBAN: uppercase IR followed by 24 ASCII digits, 26 characters
        total, no spaces. Preserve leading zeroes. Regex validates shape ONLY: runtime must validate ISO 13616 mod-97
        checksum and reject LabBank bank code 099 for this external-transfer route (bank-code substring at zero-based
        indices 4:7, per GEN-13). Never derive an account ID by blindly slicing this IBAN.'
    OperationError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        retryable:
          type: boolean
        public_message:
          type: string
          minLength: 1
        problem:
          $ref: '#/components/schemas/Problem'
      required:
      - code
      - retryable
      - public_message
      - problem
      description: Application handling error, not a Kafka broker status. All fields required. code must equal problem.code;
        problem.correlation_id must equal envelope.correlation_id (runtime validation). retryable does not imply
        safe resubmission under a new operation_id.
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
          description: 'Stable machine-readable code. Base examples: VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN,
            NOT_FOUND, CONFLICT, IDEMPOTENCY_KEY_REUSED, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT. Service-specific
            codes are permitted.'
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
      required:
      - code
      - correlation_id
      - detail
      - status
      - title
      - type
    ExternalTransferSnapshot:
      type: object
      additionalProperties: false
      properties:
        dest_iban:
          $ref: '#/components/schemas/IranianIBAN'
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Positive integer Iranian rials. Do not parse through floating-point types.
        currency:
          type: string
          const: IRR
        external_reference:
          type: string
          minLength: 1
          description: Proposed stable S5-owned tracking reference, allocated atomically when S5 durably accepts
            the transfer. Stable across queries/retries. Not necessarily an interbank settlement identifier; not
            Kafka offset. Query input remains transaction_id.
        status:
          type: string
          enum:
          - ACCEPTED
          - PROCESSING
          - SETTLED
          - FAILED
          - UNKNOWN
          description: 'ACCEPTED: durably accepted by S5, not settled. PROCESSING: in progress, not settled. SETTLED:
            S5 has definitive network settlement confirmation. FAILED: authoritative terminal failure with no settlement
            and no outstanding execution that may settle later. UNKNOWN: current settlement truth is uncertain;
            not permission to release/reverse/resubmit. Post-settlement returns/corrections require a separately
            agreed contract.'
        updated_at:
          type: string
          format: date-time
          pattern: Z$
          description: UTC time at which S5 recorded this snapshot state. Not query creation time, not a total ordering
            guarantee. S3 must reject invalid transitions and reconcile uncertain/out-of-order observations.
      required:
      - dest_iban
      - amount
      - currency
      - external_reference
      - status
      - updated_at
      description: Proposed success response body, NOT specified in api.txt. Destination/amount/currency are immutable
        accepted business inputs and must match the original command (runtime equality checks). Echoing an IBAN
        does not verify beneficiary ownership or credit. Snapshot and reference require S5 approval.
    ExternalTransferReceiptData:
      allOf:
      - $ref: '#/components/schemas/ExternalTransferSnapshot'
      - type: object
        properties:
          status:
            enum:
            - ACCEPTED
            - PROCESSING
            - SETTLED
      description: Receipt of durable acceptance. May already be processing/settled if S5 knows this definitively.
        Before-acceptance rejection uses outcome REJECTED with error; ambiguous submission uses outcome UNKNOWN
        with error, not a fabricated success receipt.
    ExternalTransferInquiryData:
      $ref: '#/components/schemas/ExternalTransferSnapshot'
    ExecuteExternalTransfer:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: S3-assigned banking transfer UUID persisted before dispatch, NOT Kafka-generated. Constant
            across execution, inquiry and results.
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an ordering
            guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S3-PAY
        message_type:
          type: string
          const: ExecuteExternalTransfer.v3
        operation_id:
          type: string
          format: uuid
          description: S3-assigned logical command UUID and internal idempotency key. Same command retry retains
            this UUID and business inputs. Each fresh inquiry uses a new UUID; it queries by transaction_id, not
            by this query operation_id.
        data:
          type: object
          additionalProperties: false
          properties:
            dest_iban:
              $ref: '#/components/schemas/IranianIBAN'
            amount:
              type: integer
              format: int64
              minimum: 1
              maximum: 9223372036854775807
              description: Positive integer Iranian rials. Do not parse through floating-point types.
            currency:
              type: string
              const: IRR
              description: ISO 4217 currency; all amounts in this draft are Iranian rials.
          required:
          - dest_iban
          - amount
          - currency
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - data
      description: Submit one external transfer. dest_iban replaces the old destination account-number field; no
        source IBAN is invented. transaction_id is in the envelope. Successful durable acceptance is not necessarily
        settlement.
      x-rest-mapping:
        path: /api/v1/stl/external_transfer
        change: dest_account_id replaced by data.dest_iban per user clarification; amount remains in data and transaction_id
          in envelope. currency=IRR carries GEN-03. New response body requires S5 approval.
    ExecuteExternalTransferResult:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: S3-assigned banking transfer UUID persisted before dispatch, NOT Kafka-generated. Constant
            across execution, inquiry and results.
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
          description: message_id of the command that triggered this result. operation_id remains the identity of
            the logical operation across retries.
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an ordering
            guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S5-STL
        message_type:
          type: string
          const: ExecuteExternalTransferResult.v3
        operation_id:
          type: string
          format: uuid
          description: Echo the triggering command operation_id unchanged.
        outcome:
          type: string
          enum:
          - APPLIED
          - REJECTED
          - UNKNOWN
          - PENDING
          description: Outcome of handling this command, NOT external settlement status. APPLIED means durable acceptance
            for execution, or completed lookup for inquiry; inspect data.status separately.
        data:
          $ref: '#/components/schemas/ExternalTransferReceiptData'
        error:
          $ref: '#/components/schemas/OperationError'
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - causation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - outcome
      allOf:
      - if:
          properties:
            outcome:
              const: APPLIED
          required:
          - outcome
        then:
          required:
          - data
          not:
            required:
            - error
      - if:
          properties:
            outcome:
              enum:
              - REJECTED
              - UNKNOWN
          required:
          - outcome
        then:
          required:
          - error
          not:
            required:
            - data
      - if:
          properties:
            outcome:
              const: PENDING
          required:
          - outcome
        then:
          not:
            anyOf:
            - required:
              - data
            - required:
              - error
      description: Dedicated reply to ExecuteExternalTransfer. S2/S1 result types cannot satisfy this schema. Echo
        transaction_id, correlation_id and operation_id; causation_id references triggering command message_id.
        All cross-message equality and expected-operation checks require runtime validation.
    InquireExternalTransfer:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: S3-assigned banking transfer UUID persisted before dispatch, NOT Kafka-generated. Constant
            across execution, inquiry and results.
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an ordering
            guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S3-PAY
        message_type:
          type: string
          const: InquireExternalTransfer.v3
        operation_id:
          type: string
          format: uuid
          description: S3-assigned logical command UUID and internal idempotency key. Same command retry retains
            this UUID and business inputs. Each fresh inquiry uses a new UUID; it queries by transaction_id, not
            by this query operation_id.
        data:
          type: object
          additionalProperties: false
          properties: {}
          description: 'Intentionally data: {}. Complete query input is envelope.transaction_id, matching api.txt.
            Never resubmit a transfer as a way to inquire.'
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - data
      description: Read authoritative S5 snapshot for transaction_id. New deliberate poll uses a new operation_id;
        retry of that poll retains it.
      x-rest-mapping:
        path-as-written-in-api-txt: /api/v1/ldg/inquiry
        note: The ldg prefix in the S5 section is suspicious; the actual S5 HTTP route requires provider confirmation.
          No replacement HTTP path is invented; Kafka inquiry topic is explicit.
    InquireExternalTransferResult:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '3.0'
        transaction_id:
          type: string
          format: uuid
          description: S3-assigned banking transfer UUID persisted before dispatch, NOT Kafka-generated. Constant
