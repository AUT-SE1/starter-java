          error:
            code: VALIDATION_ERROR
            retryable: false
            public_message: Synthetic example only.
            problem:
              type: https://errors.labbank.example/contract-example
              title: Rejected command
              status: 400
              code: VALIDATION_ERROR
              detail: No real transfer is represented.
              correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
    InquireExternalTransfer:
      name: InquireExternalTransfer
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        $ref: '#/components/schemas/InquireExternalTransfer'
      examples:
      - name: synthetic-command
        payload:
          message_id: 6421301a-cc02-463b-85bb-b41d405ca556
          schema_version: '3.0'
          transaction_id: 2c4b5314-a624-4a95-a103-b12362e74073
          correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
          occurred_at: '2026-01-01T12:00:00Z'
          producer: S3-PAY
          message_type: InquireExternalTransfer.v3
          operation_id: 526135c2-9ba0-443d-add2-bf4e929318e3
          data: {}
    InquireExternalTransferResult:
      name: InquireExternalTransferResult
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        $ref: '#/components/schemas/InquireExternalTransferResult'
      examples:
      - name: synthetic-success
        payload:
          message_id: 3f58dd8d-2318-4f10-a096-6cd2f28da1b0
          schema_version: '3.0'
          transaction_id: 2c4b5314-a624-4a95-a103-b12362e74073
          correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
          occurred_at: '2026-01-01T12:00:00Z'
          producer: S5-STL
          message_type: InquireExternalTransferResult.v3
