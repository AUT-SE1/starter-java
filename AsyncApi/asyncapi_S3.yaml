          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S5-STL
        message_type:
          type: string
          const: InquireExternalTransferResult.v3
        operation_id:
          type: string
          format: uuid
          description: Echo the triggering command operation_id unchanged.
        outcome:
          type: string
          enum:
          - APPLIED
          - REJECTED
          - UNKNOWN
          - PENDING
          description: Outcome of handling this command, NOT external settlement status. APPLIED means durable acceptance
            for execution, or completed lookup for inquiry; inspect data.status separately.
        data:
          $ref: '#/components/schemas/ExternalTransferInquiryData'
        error:
          $ref: '#/components/schemas/OperationError'
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - causation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - outcome
      allOf:
      - if:
          properties:
            outcome:
              const: APPLIED
          required:
          - outcome
        then:
          required:
          - data
          not:
            required:
            - error
      - if:
          properties:
            outcome:
              enum:
              - REJECTED
              - UNKNOWN
          required:
          - outcome
        then:
          required:
          - error
          not:
            required:
            - data
      - if:
          properties:
            outcome:
              const: PENDING
          required:
          - outcome
        then:
          not:
            anyOf:
            - required:
              - data
            - required:
              - error
      description: Dedicated reply to InquireExternalTransfer. S2/S1 result types cannot satisfy this schema. Echo
        transaction_id, correlation_id and operation_id; causation_id references triggering command message_id.
        All cross-message equality and expected-operation checks require runtime validation.
x-contract-rules:
  perspective: All actions are S3 perspective. S5 reverses send/receive, retaining topic names and payloads. operation.reply
    is a contract declaration, not an automatically implemented RPC transport.
  iban: 'Exactly one destination field: data.dest_iban. It replaces dest_account_id/dest_acc_id, not supplements
    them. Required in transfer request and both successful reply bodies. Source IBAN is not added because user mentions
    destination twice. Normalize user input before publishing; require canonical IR+24 digits, checksum mod97 and
    non-099 external bank code at runtime. Never log unmasked full IBAN by default.'
  identity: S3 generates and persists transaction_id, operation_id and command message_id; Kafka does not generate
    these business JSON fields. All workflow steps share transaction_id but distinct commands have distinct operation_id.
    S5 replies echo transaction_id/correlation_id/operation_id and use causation_id=triggering command message_id.
    Replies have their own message_id. record key is set by producer, not generated magically.
  idempotency: operation_id is the internal idempotency key; no duplicate idempotency_key field. S5 must deduplicate
    by authenticated S3 principal + operation_id, bound to command type + transaction_id + canonical business data.
    Same inputs return stored result; changed inputs return IDEMPOTENCY_KEY_REUSED. New publication retry may change
    message_id/time but not operation_id or business inputs; redelivery of a stored message preserves message_id.
    Do not fingerprint timestamps/message IDs. Re-check auth before replay response. New deliberate inquiry has
    a new operation_id to read fresh state.
  financial-dedup: 'Also enforce one external transfer per transaction_id, with immutable destination/amount/currency,
    even if a client sends another operation_id. Persist dedup, accepted transfer and result/outbox atomically.
    External network submission is not part of this local DB transaction: use a stable downstream idempotency/reference
    key and recover/query uncertain submissions. Never blindly send a second payment after an ambiguous network
    response. Kafka producer idempotence alone cannot ensure exactly-once external settlement.'
  http-key: External HTTP Idempotency-Key stays required by GEN-07. S3 persists its mapping to transaction_id and
    per-command operation_id. Do not use the same key for execution and every inquiry.
  receipt-vs-settlement: ExecuteExternalTransferResult APPLIED confirms durable S5 acceptance only; data.status
    distinguishes ACCEPTED/PROCESSING/SETTLED. REJECTED confirms no acceptance by THIS command, not absence of earlier
    commands. UNKNOWN means acceptance/effect cannot be determined. A query APPLIED with data.status FAILED means
    the lookup succeeded and the transfer definitively failed; it is not a query-handling rejection.
  inquiry: Query target is envelope.transaction_id and data is {}. Return immutable accepted inputs, stable S5 tracking
    reference, recorded status and updated_at. NOT_FOUND is a REJECTED inquiry with OperationError code NOT_FOUND/status404,
    NOT a settlement status or proof the command can never execute. Transport lag/in-flight command/unknown network
    outcome must not be interpreted as no payment. UNKNOWN snapshot is valid when lookup succeeds but settlement
    is uncertain; outcome UNKNOWN+error is used if the lookup itself cannot complete.
  outcomes: APPLIED requires typed data, forbids error. REJECTED/UNKNOWN require full error, forbid success data.
    PENDING has neither, does not permit workflow advancement, and requires durable eventual completion/recovery
    or inquiry. Error problem.status is HTTP-equivalent metadata, not a Kafka response code. Broker auth/ACL/size
    failures may yield no application reply.
  followup: This proposal uses polling for later settlement updates; no unsolicited final-result push event is invented.
    S3 continues inquiries for ACCEPTED/PROCESSING/UNKNOWN. A new status-update push topic can be agreed separately.
    Payment may remain non-final for a batch network. Poll interval, deadlines and recovery/escalation policies
    require measurable provider agreement.
  safety: S3 must not label the payment settled at ACCEPTED or PROCESSING; only SETTLED supplies final S5 settlement
    evidence under this agreed contract. S3 coordinates the ledger saga separately. Do not release/reverse holds
    or resubmit on timeout, UNKNOWN, missing result or NOT_FOUND alone. FAILED permits compensation only after authoritative
    no-settlement/no-inflight guarantee. S3 must validate snapshot inputs against its stored transfer and guard
    stale/out-of-order replies; updated_at is not a total-order version.
  replay: Store and deduplicate replies. New retry message response echoes that retry message_id in causation_id
    and retains operation_id; persist its own response identity/outbox. Replayed query result is a historical snapshot;
    do not overwrite newer/final state. Retention must cover all permitted retry/replay windows and financial audit;
    agree concrete settings before deployment.
  security: Payload producer is not authentication. TLS/SASL, ACLs, principal authorization, credentials via environment,
    data retention, masking and DLQ policy require S5/deployment agreement. Do not automatically reuse S1 token
    audience for S5.
  approval-and-compatibility: 'Breaking proposed v3: all topic suffixes v3, schema_version3.0 and message_typev3.
    S5 must approve Kafka support, new typed response/snapshot fields/status semantics/reference and recovery rules.
    api.txt specifies no detailed response body. Coordinate migration from v2; do not run both generations for one
    transfer without shared dedup. S5 inquiry HTTP path /api/v1/ldg/inquiry in api.txt needs confirmation. Only
    this standalone file is revised, not master asyncAPI, HTTP files, code or broker config.'
