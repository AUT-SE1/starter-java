asyncapi: 3.0.0
info:
  title: LabBank S3 ↔ S5 — IBAN destination and typed replies — PROPOSED
  version: 0.4.0
  description: 'S3 perspective. Proposed breaking wire v3. Destination account number replaced by dest_iban; transfer
    and inquiry have distinct reply types and explicit reply mappings. Baseline: S5 section of api.txt plus user-requested
    IBAN correction. api.txt does not define success response bodies: snapshot fields, statuses and S5 reference
    semantics below require provider agreement. This file does not prove S5 Kafka implementation.'
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Local-development example only. Production addresses and SASL/TLS policy require agreement.
channels:
  sendExecuteExternalTransfer:
    address: lab.s3.s5.command.transfer.external.v3
    messages:
      ExecuteExternalTransfer:
        $ref: '#/components/messages/ExecuteExternalTransfer'
    description: S3 produces; S5 consumes. UTF-8 record key=payload.transaction_id; validate equality. Ordering
      is per topic partition, not across transfer and inquiry topics.
  sendInquireExternalTransfer:
    address: lab.s3.s5.command.transfer.inquire.v3
    messages:
      InquireExternalTransfer:
        $ref: '#/components/messages/InquireExternalTransfer'
    description: S3 produces; S5 consumes. UTF-8 record key=payload.transaction_id; validate equality. Ordering
      is per topic partition, not across transfer and inquiry topics.
  receiveS5Result:
    address: lab.s5.s3.event.operation-result.v3
    messages:
      ExecuteExternalTransferResult:
        $ref: '#/components/messages/ExecuteExternalTransferResult'
      InquireExternalTransferResult:
        $ref: '#/components/messages/InquireExternalTransferResult'
    description: S5 produces; S3 consumes. Shared topic with TWO distinct typed reply schemas. UTF-8 key=transaction_id.
      operation.reply.messages defines which reply belongs to each command. Broker ACK is not an application result.
operations:
  sendExecuteExternalTransfer:
    action: send
    channel:
      $ref: '#/channels/sendExecuteExternalTransfer'
    messages:
    - $ref: '#/channels/sendExecuteExternalTransfer/messages/ExecuteExternalTransfer'
    reply:
      channel:
        $ref: '#/channels/receiveS5Result'
      messages:
      - $ref: '#/channels/receiveS5Result/messages/ExecuteExternalTransferResult'
    summary: ExecuteExternalTransfer → ExecuteExternalTransferResult
  sendInquireExternalTransfer:
    action: send
    channel:
      $ref: '#/channels/sendInquireExternalTransfer'
    messages:
    - $ref: '#/channels/sendInquireExternalTransfer/messages/InquireExternalTransfer'
    reply:
      channel:
        $ref: '#/channels/receiveS5Result'
      messages:
      - $ref: '#/channels/receiveS5Result/messages/InquireExternalTransferResult'
    summary: InquireExternalTransfer → InquireExternalTransferResult
  receiveS5Result:
    action: receive
    channel:
      $ref: '#/channels/receiveS5Result'
    messages:
    - $ref: '#/channels/receiveS5Result/messages/ExecuteExternalTransferResult'
    - $ref: '#/channels/receiveS5Result/messages/InquireExternalTransferResult'
components:
  messages:
    ExecuteExternalTransfer:
      name: ExecuteExternalTransfer
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        $ref: '#/components/schemas/ExecuteExternalTransfer'
      examples:
      - name: synthetic-command
        payload:
          message_id: 94136c46-c6f0-4538-9f19-9d57b0b5feed
          schema_version: '3.0'
          transaction_id: 2c4b5314-a624-4a95-a103-b12362e74073
          correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
          occurred_at: '2026-01-01T12:00:00Z'
          producer: S3-PAY
          message_type: ExecuteExternalTransfer.v3
          operation_id: 2450201b-3099-4ad9-80a7-aa0decae8cb4
          data:
            dest_iban: IR430120000000000000000001
            amount: 2500000
            currency: IRR
    ExecuteExternalTransferResult:
      name: ExecuteExternalTransferResult
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        $ref: '#/components/schemas/ExecuteExternalTransferResult'
      examples:
      - name: synthetic-success
        payload:
          message_id: 21d29d58-73ba-4fbe-bb6d-17ed19565c71
          schema_version: '3.0'
          transaction_id: 2c4b5314-a624-4a95-a103-b12362e74073
          correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
          occurred_at: '2026-01-01T12:00:00Z'
          producer: S5-STL
          message_type: ExecuteExternalTransferResult.v3
          operation_id: 2450201b-3099-4ad9-80a7-aa0decae8cb4
          data:
            dest_iban: IR430120000000000000000001
            amount: 2500000
            currency: IRR
            external_reference: S5-DEMO-REFERENCE-001
            status: ACCEPTED
            updated_at: '2026-01-01T12:00:00Z'
          causation_id: 94136c46-c6f0-4538-9f19-9d57b0b5feed
          outcome: APPLIED
      - name: synthetic-rejection
        payload:
          message_id: 9582fd1f-904a-4aaa-92e2-b3f114f66518
          schema_version: '3.0'
          transaction_id: 2c4b5314-a624-4a95-a103-b12362e74073
          correlation_id: 28759054-eb04-42c9-84ba-1d9d78872837
          occurred_at: '2026-01-01T12:00:00Z'
          producer: S5-STL
          message_type: ExecuteExternalTransferResult.v3
          operation_id: 2450201b-3099-4ad9-80a7-aa0decae8cb4
          causation_id: 94136c46-c6f0-4538-9f19-9d57b0b5feed
