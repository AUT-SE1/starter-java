# اجرا:  cp .env.example .env   (و DB_PASSWORD را پر کنید)
#        docker compose up --build -d
services:
  service:
    build: .
    container_name: s5-service
    ports:
      - "8085:8085"
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-s5_settlement_db}
      DB_USERNAME: ${DB_USERNAME:-labbank_s5}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD را در .env تعریف کنید}
      KAFKA_S3_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_S6_BOOTSTRAP_SERVERS: kafka:19092
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8085/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # Kafka (KRaft). از داخل Docker: kafka:19092 ، از سیستم شما: localhost:9092
  kafka:
    image: apache/kafka:3.8.0
    container_name: s5-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16
    container_name: s5-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-s5_settlement_db}
      POSTGRES_USER: ${DB_USERNAME:-labbank_s5}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD را در .env تعریف کنید}
    volumes:
      - s5_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  s5_pgdata:
