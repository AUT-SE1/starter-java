name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Surefire leaves the contract test out of `mvn test`: it needs a
      # neighbouring team's sandbox, which CI has no way to reach.
      - name: Test
        run: mvn -B test
      - name: Coverage report
        run: mvn -B verify
